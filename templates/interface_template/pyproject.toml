[project]
name = "interface-template"
version = "0.0.0"

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# This is how PyDFT-QMMM can find the templated interface, so every
# local or third-party interface must have entry_points defined for
# the key "pydft_qmmm.interfaces" with a variable that is assigned the
# name of the interface package (it does not matter what the name of
# the variable is).
entry-points."pydft_qmmm.interfaces".interface = "interface_template"

[tool.setuptools]
packages = [ "interface_template" ]
